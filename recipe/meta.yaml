{% set name = "pynput" %}
{% set version = "1.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/moses-palmer/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: acd65b9e979ae7efe2e2f3fad83a7eda736dd2de364efbc113a9af4c8222a6df
  patches:
    # setup_requires only lists lint/docs/upload tools, which the build does not need
    - 0001-drop-setup-requires.patch

build:
  number: 1

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
  run:
    - pyobjc-core  # [osx]
    - pyobjc-framework-cocoa  # [osx]
    - python
    - six
    - python-xlib
    - evdev  # [linux]
    - pyobjc-framework-applicationservices  # [osx]
    - pyobjc-framework-quartz  # [osx]

test:
  commands:
    - bash -c "DISPLAY=:1 python -c 'import pynput'"

about:
  home: https://github.com/moses-palmer/pynput
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: COPYING.LGPL
  summary: This library allows you to control and monitor input devices.
  doc_url: https://pynput.readthedocs.io/en/latest/
  dev_url: https://github.com/moses-palmer/pynput

extra:
  recipe-maintainers:
    - mxr-conda
    - ndmaxar
    - rluria14
    - oblute
    - Tobias-Fischer
    - ehfd
